version: '3.8'

services:
  # 1. The Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhook
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. The API Server
  api:
    build: .
    command: node dist/index.js
    ports:
      - "5000:5000"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/webhook?sslmode=disable
    depends_on:
      - db

  # 3. The Background Worker
  worker:
    build: .
    command: node dist/worker.js
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/webhook?sslmode=disable
    depends_on:
      - db

volumes:
  postgres_data: