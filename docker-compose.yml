version: '3.8'

services:
  # 1. The Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhook
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The API Server
  api:
    build: .
    command: npm run start:prod
    ports:
      - "5000:5000"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/webhook?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # 3. The Background Worker
  worker:
    build: .
    command: npm run worker:prod
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/webhook?sslmode=disable
    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data: