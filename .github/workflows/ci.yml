name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    name: Tests & Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webhook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 21 
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript Build
        run: npm run build

      - name: Run Tests
        run: npm run test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/webhook_test

  style:
    name: Style & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting & Lint
        run: |
          npm run format:check || echo "No format script found"
          npm run lint || echo "No lint script found"